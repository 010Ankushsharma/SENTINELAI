apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-api
  namespace: sentinelai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelai-api
  template:
    metadata:
      labels:
        app: sentinelai-api
    spec:
      containers:
        - name: api
          image: sentinelai/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: sentinelai-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-api
  namespace: sentinelai
spec:
  selector:
    app: sentinelai-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelai-api-hpa
  namespace: sentinelai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelai-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
